name: Build bar image

on:
  workflow_dispatch:
  #push:
    #paths:
    #  - docker/bar.base
    #  - cpp/**
    #  - python/**

jobs:
  docker:
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      # Authenticate to GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: ls
      - name: Lowercase owner
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
        shell: bash

      # Build and push Docker image
      - name: Build and push bar image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.bar
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/bar:${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.owner }}/bar:latest


