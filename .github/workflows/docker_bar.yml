name: Build bar image

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      # Authenticate to GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push Docker image
      - name: Build and push bar image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.bar
          push: true
          tags: |
            ghcr.io/${{ vars.REPO_NAME_IO }}/bar:${{ github.ref_name }}

