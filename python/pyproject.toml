[build-system]
requires = [
    "scikit-build-core[pyproject]",
    "nanobind",
]
build-backend = "scikit_build_core.build"



[project]
name = "bar"
dynamic = ["version"]
description = "A bar library"
dependencies = [
    "fenics-dolfinx>=0.11.0,<0.12.0",
]

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["bar"]

# for scikit <1 (0.12 used with dolfinx)
[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "../cpp/CMakeLists.txt"
regex = '''(?sx)
project\s*\([^)]*
VERSION\s+
(?:"|')?
(?P<value>[0-9A-Za-z.+-]+)
'''

# for scikit >1
#[[tool.dynamic-metadata]]
#provider = "scikit_build_core.metadata.regex"
