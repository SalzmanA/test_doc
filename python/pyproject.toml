[build-system]
requires = [
    "scikit-build-core[pyproject]",
    "nanobind",
]
build-backend = "scikit_build_core.build"



[project]
name = "bar"
dynamic = ["version"]
description = "A bar library"
dependencies = [
    "fenics-dolfinx>=0.11.0,<0.12.0",
]

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["bar"]

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.regex"
field = "version"
input = "../cpp/CMakeLists.txt"
regex = '''(?sx)
project\s*\(
.*?
VERSION\s+
(?:"|')?
(?P<value>[0-9A-Za-z.+-]+)
'''
[[tool.scikit-build.generate]]
path = "bar/_version.py"
template = '''
__version__ = "${version}"
'''
